version: "3.8"

# ==============================================================================
# Docker Compose Configuration for NILM Disaggregation Engine & Dashboard
# ==============================================================================

services:
  nilm-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: nilm-disagg-engine:latest
    container_name: nilm_pipeline_runner
    working_dir: /app
    volumes:
      - ${DATA_PATH:-./data}:/app/data:ro
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - MPLCONFIGDIR=/app/outputs/.matplotlib_cache
    command: ["--all"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: nilm-disagg-engine:latest
    container_name: nilm_dashboard
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    entrypoint: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
